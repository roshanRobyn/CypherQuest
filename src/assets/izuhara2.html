<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost of Tsushima - Accurate Izuhara Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #dcdedc; 
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            overflow: hidden;
        }

        #map {
            width: 100%; height: 100vh;
            background-color: #dcdedc; 
        }

        #ui-overlay {
            position: absolute;
            top: 30px; left: 40px;
            z-index: 1000;
            color: #111; 
            pointer-events: none;
        }

        h1 {
            font-size: 3rem; margin: 0;
            text-transform: uppercase;
            letter-spacing: 8px;
            font-weight: bold;
            border-bottom: 3px solid #111; 
            padding-bottom: 10px;
            display: inline-block;
        }

        h2 {
            font-size: 1.2rem; margin-top: 10px;
            color: #333;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Standard Game Icons */
        .got-icon {
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(0px 0px 3px rgba(0,0,0,0.8));
        }
        .got-icon:hover { transform: scale(1.3); }

        /* Mongol Camp Markers */
        .camp-marker {
            background-color: transparent;
            border-radius: 50%;
            border: 3px solid;
            cursor: pointer;
            transition: all 0.2s;
        }
        .camp-marker.red { border-color: #ff3b3b; box-shadow: 0 0 5px #ff3b3b; }
        .camp-marker.black { border-color: #000; box-shadow: 0 0 5px #000; background: rgba(0,0,0,0.5); }
        .camp-marker:hover { background-color: rgba(255, 255, 255, 0.8); transform: scale(1.3); }

        /* Permanent Area Text */
        .main-label {
            background-color: transparent;
            border: none;
            box-shadow: none;
            color: #f0f0f0; 
            font-family: 'Palatino Linotype', serif;
            font-size: 14px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 1px 1px 3px #000, -1px -1px 3px #000; 
        }
        .main-label::before { display: none; }

        /* Hover Tooltips */
        .minor-label {
            background: rgba(10, 10, 10, 0.9);
            color: #fff;
            border: 1px solid #d4af37;
            border-radius: 2px;
            font-family: 'Palatino Linotype', serif;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 5px 12px;
            text-transform: uppercase;
        }
        .minor-label::before { border-top-color: #d4af37; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Izuhara</h1>
        <h2>Central / Southern Region</h2>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3,
            zoomControl: true 
        });

        const w = 1000; 
        const h = 1000; 
        const bounds = [[0, 0], [h, w]];

        // Highly accurate SVG trace of the Izuhara coastline based on the reference image
        const svgMap = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
            <defs>
                <filter id="ink-edge">
                    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
                </filter>
            </defs>
            
            <rect width="1000" height="1000" fill="#dcdedc" />
            
            <!-- Accurate Izuhara Landmass Outline -->
            <path d="M 420 50 L 500 80 L 560 50 L 620 120 L 680 160 L 710 220 L 750 300 L 720 360 
                     L 740 420 L 780 480 L 760 560 L 780 620 L 740 680 L 700 740 L 750 820 L 720 900 
                     L 620 980 L 580 920 L 520 980 L 460 900 L 400 950 L 340 860 L 280 820 L 340 760 
                     L 300 680 L 360 620 L 280 540 L 250 480 L 290 420 L 360 380 L 320 320 L 260 260 
                     L 340 180 L 380 100 Z" 
                  fill="#3c3d40" stroke="#222" stroke-width="1.5" filter="url(#ink-edge)" />
            
            <!-- Central Lake (Ariake) -->
            <path d="M 520 310 L 560 320 L 580 345 L 550 370 L 490 370 L 490 330 Z" fill="#dcdedc" filter="url(#ink-edge)" />
            
            <!-- Accurate River Network -->
            <!-- West River (Kashine Bay to Lake) -->
            <path d="M 360 380 Q 420 380 490 350" fill="none" stroke="#dcdedc" stroke-width="5" filter="url(#ink-edge)" />
            <!-- Main Central River (Lake to Southern Estuary) -->
            <path d="M 520 370 Q 490 450 520 550 T 500 750 T 520 850 T 570 930" fill="none" stroke="#dcdedc" stroke-width="6" filter="url(#ink-edge)" />
            <!-- East River (Central River to East Coast) -->
            <path d="M 520 550 Q 600 580 700 560 T 770 600" fill="none" stroke="#dcdedc" stroke-width="4" filter="url(#ink-edge)" />
        </svg>`;

        const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMap);
        L.imageOverlay(svgUrl, bounds).addTo(map);
        map.fitBounds(bounds);
        map.setView([h/2, w/2], 0);

        // --- Custom Icons ---
        const villageIconSVG = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2L2 12h3v8h14v-8h3L12 2z"/></svg>`;
        const toriiIconSVG = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 6h16v2H4zm2 2v12h2V8zm10 0v12h2V8zm-8 4h6v2H8z"/></svg>`;
        const hotSpringSVG = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 14c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4zm-2-10s-1 2 0 4 2 2 2 4c0-2-1-4-2-6-1-2 0-2 0-2zm4 0s-1 2 0 4 2 2 2 4c0-2-1-4-2-6-1-2 0-2 0-2z"/></svg>`;

        const createIcon = (svgString) => L.divIcon({ className: 'got-icon', html: svgString, iconSize: [24, 24], iconAnchor: [12, 12] });
        const createCamp = (color) => L.divIcon({ className: `camp-marker ${color}`, iconSize: [16, 16], iconAnchor: [8, 8] });

        const icons = {
            village: createIcon(villageIconSVG),
            torii: createIcon(toriiIconSVG),
            spring: createIcon(hotSpringSVG),
            redCamp: createCamp('red'),
            blackCamp: createCamp('black'),
            empty: L.divIcon({ className: 'empty-icon', html: '', iconSize: [0, 0] }) 
        };

        // --- Marker Data Adjusted for the highly accurate Map Shape ---
        const locations = [
            // --- MAIN TEXT LABELS ---
            { name: "Komoda", isMain: true, y: 160, x: 450, icon: icons.empty },
            { name: "Hiyoshi", isMain: true, y: 220, x: 650, icon: icons.empty },
            { name: "Kashine", isMain: true, y: 340, x: 380, icon: icons.empty },
            { name: "Ariake", isMain: true, y: 440, x: 620, icon: icons.empty },
            { name: "Komatsu", isMain: true, y: 500, x: 380, icon: icons.empty },
            { name: "Tsutsu", isMain: true, y: 780, x: 400, icon: icons.empty },
            { name: "Azamo", isMain: true, y: 820, x: 580, icon: icons.empty },

            // --- WHITE GAME ICONS ---
            { name: "Komoda Town", isMain: false, y: 190, x: 400, icon: icons.village },
            { name: "Shinto Shrine", isMain: false, y: 270, x: 310, icon: icons.torii },
            { name: "Hot Spring", isMain: false, y: 270, x: 350, icon: icons.spring },
            
            { name: "Castle Kaneda", isMain: false, y: 80, x: 650, icon: icons.village },
            { name: "Hiyoshi Springs Village", isMain: false, y: 270, x: 680, icon: icons.village },
            { name: "Hiyoshi Hot Spring", isMain: false, y: 250, x: 590, icon: icons.spring },
            { name: "Shinto Shrine", isMain: false, y: 200, x: 720, icon: icons.torii },
            { name: "Hot Spring", isMain: false, y: 400, x: 710, icon: icons.spring },
            
            { name: "Golden Temple", isMain: false, y: 440, x: 550, icon: icons.village },
            { name: "Shinto Shrine", isMain: false, y: 530, x: 600, icon: icons.torii },
            
            { name: "Komatsu Forge", isMain: false, y: 530, x: 430, icon: icons.village },
            { name: "Shinto Shrine", isMain: false, y: 460, x: 420, icon: icons.torii },
            { name: "Shinto Shrine", isMain: false, y: 640, x: 480, icon: icons.torii },
            
            { name: "Azamo Bay", isMain: false, y: 920, x: 590, icon: icons.village },
            { name: "Hot Spring", isMain: false, y: 850, x: 660, icon: icons.spring },
            { name: "Shinto Shrine", isMain: false, y: 770, x: 550, icon: icons.torii },
            { name: "Tsutsu Hot Spring", isMain: false, y: 800, x: 350, icon: icons.spring },

            // --- MONGOL CAMPS ---
            { name: "Mongol Camp", isMain: false, y: 390, x: 350, icon: icons.blackCamp },
            { name: "Mongol Camp", isMain: false, y: 730, x: 410, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 850, x: 350, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 920, x: 430, icon: icons.redCamp },
            
            { name: "Mongol Camp", isMain: false, y: 840, x: 490, icon: icons.blackCamp },
            { name: "Mongol Camp", isMain: false, y: 790, x: 680, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 720, x: 700, icon: icons.blackCamp },
            
            { name: "Mongol Camp", isMain: false, y: 760, x: 500, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 630, x: 530, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 550, x: 710, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 380, x: 480, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 340, x: 430, icon: icons.redCamp },
            
            { name: "Mongol Camp", isMain: false, y: 150, x: 400, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 130, x: 490, icon: icons.blackCamp },
            { name: "Mongol Camp", isMain: false, y: 330, x: 660, icon: icons.redCamp },
            { name: "Mongol Camp", isMain: false, y: 250, x: 550, icon: icons.blackCamp },
            { name: "Mongol Camp", isMain: false, y: 310, x: 540, icon: icons.redCamp }
        ];

        locations.forEach(loc => {
            let marker = L.marker([1000 - loc.y, loc.x], { icon: loc.icon }).addTo(map);
            
            if (loc.isMain) {
                marker.bindTooltip(loc.name, {
                    permanent: true, 
                    direction: 'center', 
                    className: 'main-label'
                });
            } else {
                marker.bindTooltip(loc.name, {
                    permanent: false, 
                    direction: 'top', 
                    className: 'minor-label',
                    offset: [0, -10]
                });
            }
        });
    </script>
</body>
</html>
