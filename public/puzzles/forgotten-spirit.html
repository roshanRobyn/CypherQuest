<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cypher Quest — The Sacred Trial</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================================
   BODY
========================================================= */

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(55, 76, 69, 0.20),
            transparent 46%
        ),
        linear-gradient(
            180deg,
            #050807,
            #0b1110 55%,
            #030505
        );

    color: #d9d1bd;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =========================================================
   GAME
========================================================= */

.game {
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;
}


.panel {

    /*
      Board-only stage: a single centered column (the clues that used to
      live in the right column are now a separate inventory document, see
      GameplayScreen's ForgottenSpiritStage / whispers viewer). Sized
      relative to its own box, not the raw viewport, so it can never
      overflow the gameplay frame regardless of iframe size.
    */
    width: 100%;
    max-width: 860px;

    height: 100%;
    max-height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 32px;

    background:
        rgba(7, 11, 10, 0.96);

    border:
        1px solid
        rgba(190, 169, 120, 0.25);

    box-shadow:
        0 0 80px rgba(0, 0, 0, 0.8),
        inset 0 0 45px rgba(0, 0, 0, 0.35);

    transform-origin: center center;
}


/* =========================================================
   LEFT
========================================================= */

.left {

    width: 100%;
    min-width: 0;
    height: 100%;
    min-height: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 14px;
}


/* =========================================================
   BOARD
========================================================= */

.board {

    /*
      Sized relative to its own column (.left), not the raw viewport —
      this is what keeps it confined to the left half and away from the
      gameplay frame regardless of iframe size.
    */
    width: 100%;
    max-width: 720px;
    max-height: 100%;
    min-height: 0;

    aspect-ratio: 1;

    padding: 17px;

    position: relative;

    background:
        linear-gradient(
            135deg,
            #76684e,
            #8d7a5b 50%,
            #625640
        );

    border:
        8px solid
        #292a24;

    box-shadow:
        0 18px 40px rgba(0,0,0,.7),
        inset 0 0 25px rgba(35,28,18,.4);

    transition:
        box-shadow 1s ease;
}


.board::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .35;

    background:
        repeating-linear-gradient(
            8deg,
            transparent 0,
            transparent 18px,
            rgba(42,32,20,.10) 19px,
            transparent 22px
        );
}


/* =========================================================
   GRID
========================================================= */

.grid {

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        repeat(9, 1fr);

    grid-template-rows:
        repeat(9, 1fr);

    position: relative;

    z-index: 2;
}


/* =========================================================
   CELLS
========================================================= */

.cell {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(48,39,25,.65);

    transition:
        background .2s ease,
        box-shadow .2s ease;
}


.cell:hover {

    background:
        rgba(235,220,180,.07);
}


.cell.selected {

    background:
        rgba(220,204,158,.18);

    box-shadow:
        inset 0 0 18px
        rgba(220,204,158,.16);
}


.cell.drag-over {

    background:
        rgba(225,208,165,.22);

    box-shadow:
        inset 0 0 20px
        rgba(225,208,165,.2);
}


/* =========================================================
   STONES
========================================================= */

.stone {

    width:
        clamp(26px, 3.4vw, 44px);

    height:
        clamp(26px, 3.4vw, 44px);

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    position: relative;

    z-index: 5;

    cursor: grab;

    user-select: none;

    font-size:
        clamp(14px, 1.7vw, 21px);

    box-shadow:
        0 7px 13px rgba(0,0,0,.62);

    transition:
        transform .18s ease,
        box-shadow .25s ease,
        filter .2s ease;
}


.stone:hover {

    transform: scale(1.08);

    filter: brightness(1.08);
}


.stone:active {

    cursor: grabbing;

    transform: scale(1.12);
}


/* =========================================================
   STONE STYLES
========================================================= */

.white {

    background:
        radial-gradient(
            circle at 32% 28%,
            #f3f0e4,
            #aaa99e
        );

    color: #353832;
}


.red {

    background:
        radial-gradient(
            circle at 32% 28%,
            #bc6e5e,
            #612f2b
        );

    color: #f1e5d3;
}


.black {

    background:
        radial-gradient(
            circle at 32% 28%,
            #575d58,
            #151917
        );

    color: #e0d9c5;
}


.fox {

    background:
        radial-gradient(
            circle at 32% 28%,
            #bd895f,
            #62432e
        );

    color: #f1e4cf;

    font-size:
        clamp(18px, 2.3vw, 28px);
}


.moon {

    background:
        radial-gradient(
            circle at 32% 28%,
            #e7e3ca,
            #878774
        );

    color: #34372f;

    font-size:
        clamp(20px, 2.5vw, 30px);
}


.green {

    background:
        radial-gradient(
            circle at 32% 28%,
            #718577,
            #35443b
        );

    color: #e2dfcf;
}


.blue {

    background:
        radial-gradient(
            circle at 32% 28%,
            #758a8e,
            #39484c
        );

    color: #e4e0d1;
}


.purple {

    background:
        radial-gradient(
            circle at 32% 28%,
            #908095,
            #4b414e
        );

    color: #ebe2d3;
}


.bell {

    background:
        radial-gradient(
            circle at 32% 28%,
            #b59c65,
            #655538
        );

    color: #eee2c5;

    font-size:
        clamp(17px, 2.2vw, 27px);
}


.crow {

    background:
        radial-gradient(
            circle at 32% 28%,
            #59615d,
            #202622
        );

    color: #ded9c7;

    font-size:
        clamp(18px, 2.4vw, 29px);

    text-shadow:
        0 1px 2px rgba(0,0,0,.9);
}


.sun {

    background:
        radial-gradient(
            circle at 32% 28%,
            #d4b76e,
            #765d2f
        );

    color: #f0e4c9;

    font-size:
        clamp(20px, 2.5vw, 30px);
}


.leaf {

    background:
        radial-gradient(
            circle at 32% 28%,
            #84936e,
            #3e4b36
        );

    color: #e4e0ce;

    font-size:
        clamp(17px, 2.3vw, 28px);
}


.rain {

    background:
        radial-gradient(
            circle at 32% 28%,
            #71858d,
            #35464d
        );

    color: #e4e1d4;

    font-size:
        clamp(18px, 2.3vw, 28px);
}


.skull {

    background:
        radial-gradient(
            circle at 32% 28%,
            #b6b09e,
            #55564f
        );

    color: #292c28;

    font-size:
        clamp(18px, 2.3vw, 28px);
}


.lotus {

    background:
        radial-gradient(
            circle at 32% 28%,
            #aa8791,
            #59434c
        );

    color: #eee3d8;

    font-size:
        clamp(19px, 2.4vw, 29px);
}


/* =========================================================
   PLAY NOTE
========================================================= */

.play-note {

    margin-top: 16px;

    padding: 13px;

    border:
        1px solid
        rgba(190,169,120,.13);

    color: #70776f;

    font-size: 10px;

    line-height: 1.6;
}


.play-note strong {

    color: #a39b86;

    letter-spacing: 2px;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    min-height: 22px;

    color: #737a73;

    font-size: 11px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    text-align: center;
}


.status.success {

    color: #ded5b9;
}


/* =========================================================
   RESET
========================================================= */

.reset {

    flex-shrink: 0;

    padding: 9px 22px;

    background: transparent;

    border:
        1px solid
        rgba(190,169,120,.28);

    color: #858377;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 11px;

    letter-spacing: 2px;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease;
}


.reset:hover {

    background:
        rgba(190,169,120,.08);

    color: #c9c1ac;
}


/* =========================================================
   COMPLETION GLOW
========================================================= */

.board.completed {

    box-shadow:

        0 0 35px
        rgba(196,178,115,.27),

        0 0 90px
        rgba(112,145,128,.14),

        inset 0 0 30px
        rgba(215,198,150,.14);
}


.board.completed .stone {

    box-shadow:

        0 0 18px
        rgba(215,204,165,.4),

        0 7px 13px
        rgba(0,0,0,.55);

    animation:
        stoneGlow 2.5s
        ease-in-out
        infinite;
}


@keyframes stoneGlow {

    0%,100% {

        filter:
            brightness(1);
    }

    50% {

        filter:
            brightness(1.16);
    }

}


/* =========================================================
   SUCCESS OVERLAY
========================================================= */

.success-overlay {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;

    background:

        radial-gradient(
            circle,
            rgba(148,139,91,.18),
            transparent 40%
        ),

        rgba(2,6,5,.84);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}


.success-overlay.show {

    opacity: 1;

    visibility: visible;
}


/* =========================================================
   SUCCESS SEAL
========================================================= */

.success-seal {

    width: 88px;

    height: 88px;

    display: flex;

    justify-content: center;

    align-items: center;

    border:
        1px solid
        rgba(202,187,133,.7);

    color: #d9d0ae;

    font-size: 43px;

    margin-bottom: 28px;

    box-shadow:
        0 0 25px
        rgba(194,178,119,.2);

    animation:
        sealIn 1.1s ease forwards,
        sealGlow 2.5s ease-in-out infinite 1.1s;
}


@keyframes sealIn {

    0% {

        opacity: 0;

        transform:
            scale(.45)
            rotate(-10deg);
    }

    70% {

        opacity: 1;

        transform:
            scale(1.08)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }

}


@keyframes sealGlow {

    0%,100% {

        box-shadow:
            0 0 20px
            rgba(194,178,119,.18);
    }

    50% {

        box-shadow:
            0 0 45px
            rgba(194,178,119,.38);
    }

}


/* =========================================================
   SUCCESS TEXT
========================================================= */

.success-japanese {

    font-size:
        clamp(20px,4vw,34px);

    letter-spacing: 5px;

    color: #ded5ba;

    margin-bottom: 15px;

    text-shadow:
        0 0 20px
        rgba(218,205,165,.28);
}


.success-english {

    color: #858c83;

    font-size: 10px;

    letter-spacing: 4px;
}

</style>
</head>


<body>


<!-- =======================================================
     GAME
======================================================= -->

<div class="game">

<div class="panel" id="panel">


<!-- =====================================================
     BOARD
===================================================== -->

<section class="left">


<div
    class="board"
    id="board"
>


    <div
        class="grid"
        id="grid"
    ></div>


</div>


<div
    class="status"
    id="status"
>

    The stones await their places.

</div>


<button
    type="button"
    class="reset"
    id="reset"
>

    RESET BOARD

</button>


</section>


<!-- =====================================================
     (removed) CLUES — moved to the inventory "Whispers of
     the Spirit" document; see WhispersViewer.jsx
===================================================== -->

</div>

</div>


<!-- =======================================================
     SUCCESS
======================================================= -->

<div
    class="success-overlay"
    id="successOverlay"
>


<div class="success-seal">
    道
</div>


<div class="success-japanese">

    秘められし道、開かれん

</div>


<div class="success-english">

    THE HIDDEN PATH IS REVEALED

</div>


</div>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const grid =
    document.getElementById("grid");

const boardElement =
    document.getElementById("board");

const statusText =
    document.getElementById("status");

const resetButton =
    document.getElementById("reset");

const successOverlay =
    document.getElementById("successOverlay");


/* =========================================================
   BOARD SIZE
========================================================= */

const SIZE = 9;


/* =========================================================
   STONES
========================================================= */

const stones = [

    { id: "fox", symbol: "🦊", className: "fox" },
    { id: "moon", symbol: "☾", className: "moon" },
    { id: "blue", symbol: "●", className: "blue" },
    { id: "black", symbol: "●", className: "black" },
    { id: "red", symbol: "●", className: "red" },
    { id: "purple", symbol: "●", className: "purple" },
    { id: "green", symbol: "●", className: "green" },
    { id: "white", symbol: "●", className: "white" },
    { id: "bell", symbol: "🔔", className: "bell" },
    { id: "crow", symbol: "🐦‍⬛", className: "crow" },
    { id: "sun", symbol: "☀", className: "sun" },
    { id: "leaf", symbol: "🍃", className: "leaf" },
    { id: "rain", symbol: "💧", className: "rain" },
    { id: "skull", symbol: "☠", className: "skull" },
    { id: "lotus", symbol: "✿", className: "lotus" }

];


/* =========================================================
   FINAL SOLUTION
========================================================= */

const solution = {
    fox: { row: 5, col: 5 },
    moon: { row: 3, col: 5 },
    blue: { row: 3, col: 4 },
    black: { row: 3, col: 1 },
    red: { row: 4, col: 1 },
    purple: { row: 4, col: 2 },
    green: { row: 5, col: 8 },
    white: { row: 9, col: 9 },
    bell: { row: 7, col: 9 },
    crow: { row: 6, col: 9 },
    sun: { row: 4, col: 5 },
    leaf: { row: 6, col: 5 },
    rain: { row: 6, col: 7 },
    skull: { row: 8, col: 7 },
    lotus: { row: 9, col: 7 }
};


/* =========================================================
   STARTING POSITIONS
========================================================= */

const startingPositions = {
    fox: 8,
    moon: 17,
    blue: 72,
    black: 22,
    red: 4,
    purple: 44,
    green: 30,
    white: 0,
    bell: 61,
    crow: 13,
    sun: 70,
    leaf: 27,
    rain: 56,
    skull: 36,
    lotus: 76
};


/* =========================================================
   GAME STATE
========================================================= */

let board = [];
let selectedIndex = null;
let draggedStone = null;
let draggedFrom = null;


/* =========================================================
   CREATE STARTING BOARD
========================================================= */

function createStartingBoard() {
    const result = Array(SIZE * SIZE).fill(null);

    Object.entries(startingPositions).forEach(([stone, index]) => {
        result[index] = stone;
    });

    return result;
}


/* =========================================================
   CREATE GRID
========================================================= */

function createBoard() {
    grid.innerHTML = "";

    for (let row = 1; row <= SIZE; row++) {
        for (let col = 1; col <= SIZE; col++) {
            const index = (row - 1) * SIZE + (col - 1);

            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.index = index;

            cell.addEventListener("dragover", handleDragOver);
            cell.addEventListener("dragleave", handleDragLeave);
            cell.addEventListener("drop", handleDrop);
            cell.addEventListener("click", handleCellClick);

            grid.appendChild(cell);
        }
    }

    renderBoard();
}


/* =========================================================
   RENDER
========================================================= */

function renderBoard() {
    const cells = grid.querySelectorAll(".cell");

    cells.forEach((cell, index) => {
        cell.innerHTML = "";
        cell.classList.remove("selected");

        if (selectedIndex === index) {
            cell.classList.add("selected");
        }

        const stoneId = board[index];
        if (!stoneId) return;

        const data = stones.find(stone => stone.id === stoneId);
        if (!data) return;

        const stone = document.createElement("div");
        stone.className = `stone ${data.className}`;
        stone.textContent = data.symbol;
        stone.draggable = true;
        stone.dataset.stone = data.id;
        stone.title = data.id.toUpperCase();
        stone.setAttribute("aria-label", `${data.id} stone`);

        stone.addEventListener("dragstart", handleDragStart);
        stone.addEventListener("click", event => {
            event.stopPropagation();
            selectStone(index);
        });

        cell.appendChild(stone);
    });
}


/* =========================================================
   SELECT STONE
========================================================= */

function selectStone(index) {
    if (board[index] === null) return;

    selectedIndex = index;
    statusText.textContent = "Choose another square.";
    renderBoard();
}


/* =========================================================
   CLICK
========================================================= */

function handleCellClick(event) {
    const index = Number(event.currentTarget.dataset.index);

    if (selectedIndex === null) {
        if (board[index] !== null) {
            selectStone(index);
        }
        return;
    }

    if (selectedIndex === index) {
        selectedIndex = null;
        statusText.textContent = "The stones await their places.";
        renderBoard();
        return;
    }

    const selectedStone = board[selectedIndex];
    const targetStone = board[index];

    board[index] = selectedStone;
    board[selectedIndex] = targetStone;

    selectedIndex = null;

    renderBoard();
    checkSolution();
}


/* =========================================================
   DRAG START
========================================================= */

function handleDragStart(event) {
    draggedStone = event.currentTarget.dataset.stone;
    draggedFrom = Number(event.currentTarget.parentElement.dataset.index);
    selectedIndex = null;
    event.dataTransfer.effectAllowed = "move";
}


/* =========================================================
   DRAG OVER
========================================================= */

function handleDragOver(event) {
    event.preventDefault();
    event.currentTarget.classList.add("drag-over");
}


/* =========================================================
   DRAG LEAVE
========================================================= */

function handleDragLeave(event) {
    event.currentTarget.classList.remove("drag-over");
}


/* =========================================================
   DROP
========================================================= */

function handleDrop(event) {
    event.preventDefault();

    const target = event.currentTarget;
    target.classList.remove("drag-over");

    const targetIndex = Number(target.dataset.index);

    if (draggedFrom === null || draggedStone === null) return;

    const targetStone = board[targetIndex];

    board[targetIndex] = draggedStone;
    board[draggedFrom] = targetStone;

    draggedStone = null;
    draggedFrom = null;

    renderBoard();
    checkSolution();
}


/* =========================================================
   POSITION
========================================================= */

function getPosition(stoneId) {
    const index = board.indexOf(stoneId);
    if (index === -1) return null;

    return {
        row: Math.floor(index / SIZE) + 1,
        col: (index % SIZE) + 1
    };
}


/* =========================================================
   SOLUTION CHECK
========================================================= */

function checkSolution() {
    let solved = true;

    for (const stone of stones) {
        const current = getPosition(stone.id);
        const target = solution[stone.id];

        if (!current || current.row !== target.row || current.col !== target.col) {
            solved = false;
            break;
        }
    }

    if (solved) {
        statusText.textContent = "The forgotten arrangement has been restored.";
        statusText.classList.add("success");
        boardElement.classList.add("completed");

        /* Notify the parent React app that the puzzle is solved */
        window.parent.postMessage({ type: "cq:puzzle-complete", id: "forgotten-spirit" }, "*");

        setTimeout(() => {
            successOverlay.classList.add("show");
        }, 700);

        return;
    }

    statusText.classList.remove("success");

    let correctCount = 0;

    stones.forEach(stone => {
        const current = getPosition(stone.id);
        const target = solution[stone.id];

        if (current && current.row === target.row && current.col === target.col) {
            correctCount++;
        }
    });

    if (correctCount === 0) {
        statusText.textContent = "The shrine gives no answer.";
    } else if (correctCount <= 3) {
        statusText.textContent = "The stones begin to remember.";
    } else if (correctCount <= 6) {
        statusText.textContent = "Fragments of the old order emerge.";
    } else if (correctCount <= 10) {
        statusText.textContent = "The pattern is taking shape.";
    } else if (correctCount <= 13) {
        statusText.textContent = "The shrine is almost restored.";
    } else {
        statusText.textContent = "Only the final positions remain.";
    }
}


/* =========================================================
   RESET
========================================================= */

function resetGame() {
    board = createStartingBoard();
    selectedIndex = null;
    draggedStone = null;
    draggedFrom = null;

    statusText.textContent = "The stones await their places.";
    statusText.classList.remove("success");
    boardElement.classList.remove("completed");
    successOverlay.classList.remove("show");

    renderBoard();
}


resetButton.addEventListener("click", resetGame);


/* =========================================================
   START
========================================================= */

board = createStartingBoard();
createBoard();


/* =========================================================
   FIT TO VIEWPORT
   Scales the whole panel down so it always fits inside the
   gameplay iframe without producing a scrollbar, never cropping it.
========================================================= */

const panel = document.getElementById("panel");

function fitStage() {
    panel.style.transform = "none";

    const rect = panel.getBoundingClientRect();
    const availW = window.innerWidth - 16;
    const availH = window.innerHeight - 16;

    const fit = Math.min(1, availW / rect.width, availH / rect.height);

    panel.style.transform = `scale(${fit})`;
}

window.addEventListener("resize", fitStage);
fitStage();

</script>

</body>
</html>
